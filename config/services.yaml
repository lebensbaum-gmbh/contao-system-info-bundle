parameters:
    env(CONTAO_SYSTEM_INFO_ID): ''
    env(CONTAO_SYSTEM_INFO_SECRET): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Lebensbaum\ContaoSystemInfoBundle\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/DependencyInjection/'
            - '../src/ContaoSystemInfoBundle.php'

    Lebensbaum\ContaoSystemInfoBundle\Backend\SystemInfoBackendModule:
        public: true

    Lebensbaum\ContaoSystemInfoBundle\Security\SecretCipher:
        arguments:
            $kernelSecret: '%kernel.secret%'

    Lebensbaum\ContaoSystemInfoBundle\Security\CredentialStore:
        public: true
        arguments:
            $legacySystemId: '%env(string:CONTAO_SYSTEM_INFO_ID)%'
            $legacySharedSecret: '%env(string:CONTAO_SYSTEM_INFO_SECRET)%'

    Lebensbaum\ContaoSystemInfoBundle\Security\ActionNonceStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Lebensbaum\ContaoSystemInfoBundle\SystemInfo\SystemInfoProvider:
        arguments:
            $environment: '%kernel.environment%'

    Lebensbaum\ContaoSystemInfoBundle\SystemInfo\LogProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Lebensbaum\ContaoSystemInfoBundle\Backup\ProjectArchiveBuilder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Lebensbaum\ContaoSystemInfoBundle\Backup\BackupService:
        arguments:
            $backupManager: '@contao.doctrine.backup_manager'
            $projectDir: '%kernel.project_dir%'

    Lebensbaum\ContaoSystemInfoBundle\Controller\SystemInfoController:
        public: true
        tags:
            - 'controller.service_arguments'

    Lebensbaum\ContaoSystemInfoBundle\Controller\LogController:
        public: true
        tags:
            - 'controller.service_arguments'

    Lebensbaum\ContaoSystemInfoBundle\Controller\BackupController:
        public: true
        tags:
            - 'controller.service_arguments'
